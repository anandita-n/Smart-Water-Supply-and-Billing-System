<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HydroCore</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4C20 20 12 29 12 40a20 20 0 0 0 40 0C52 29 44 20 32 4z' fill='%231558b0'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ============ SIGN IN / CREATE ACCOUNT ============ -->
<div id="auth-screen" class="auth-screen">
  <svg class="auth-wave" viewBox="0 0 1440 340" preserveAspectRatio="none" aria-hidden="true">
    <path fill="#e3f0fb" d="M0,0H1440V250C1210,330 1010,170 760,225C520,278 290,345 0,250Z"/>
    <path fill="#c4def5" d="M0,0H1440V200C1230,280 1030,120 780,172C540,222 300,300 0,205Z"/>
  </svg>
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 64 64" width="44" height="44" aria-hidden="true"><path d="M32 4C20 20 12 29 12 40a20 20 0 0 0 40 0C52 29 44 20 32 4z" fill="#1558b0"/></svg>
      <div class="auth-name">HydroCore</div>
    </div>

    <form id="login-form" autocomplete="on" novalidate>
      <h1>Sign in</h1>
      <p class="sub">to continue to HydroCore</p>
      <input id="l-user" aria-label="Username" autocomplete="username" placeholder="Username">
      <input id="l-pass" type="password" aria-label="Password" autocomplete="current-password" placeholder="Password">
      <div id="auth-msg" class="form-msg" role="alert"></div>
      <div class="auth-actions">
        <button id="tab-register" class="link" type="button">Create account</button>
        <button id="login-btn" class="btn primary" type="submit">Sign in</button>
      </div>
    </form>

    <form id="register-form" class="hidden" novalidate>
      <h1>Create account</h1>
      <p class="sub">for HydroCore customers</p>
      <input id="r-name" aria-label="Full name" placeholder="Full name">
      <input id="r-user" aria-label="Username" placeholder="Username (3-30 letters, numbers or _)">
      <input id="r-pass" type="password" aria-label="Password" placeholder="Password (at least 6 characters)">
      <div id="reg-msg" class="form-msg" role="alert"></div>
      <div class="auth-actions">
        <button id="tab-login" class="link" type="button">Sign in instead</button>
        <button id="register-btn" class="btn primary" type="submit">Create</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ APPLICATION ============ -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg viewBox="0 0 64 64" width="22" height="22" aria-hidden="true"><path d="M32 4C20 20 12 29 12 40a20 20 0 0 0 40 0C52 29 44 20 32 4z" fill="#1558b0"/></svg>
        <span>HydroCore</span>
      </div>
      <nav id="nav"></nav>
      <div class="user">
        <button id="who" class="who-btn" type="button" title="My profile"></button><span id="role-label" class="role"></span>
        <button id="logout-btn" class="link" type="button">Sign out</button>
      </div>
    </div>
  </header>
  <main id="view" class="page"></main>
</div>

<!-- ============ PAYMENT DIALOG ============ -->
<div id="pay-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="pay-title">
  <div class="dialog">
    <h3 id="pay-title">Pay bill</h3>
    <div id="pay-body"></div>
    <div class="dialog-actions">
      <button id="confirm-cancel" class="link" type="button">Cancel</button>
      <button id="confirm-ok" class="btn primary" type="button">Pay now</button>
    </div>
  </div>
</div>

<!-- ============ RECORD READING DIALOG (admin) ============ -->
<div id="rd-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="rd-title">
  <div class="dialog wide">
    <h3 id="rd-title">Record meter reading</h3>
    <div id="rd-body"></div>
    <div class="dialog-actions">
      <button id="rd-cancel" class="link" type="button">Cancel</button>
      <button id="read-btn" class="btn" type="button">Save reading</button>
      <button id="read-bill-btn" class="btn primary" type="button">Save and generate bill</button>
    </div>
  </div>
</div>

<!-- ============ EDIT NAME DIALOG ============ -->
<div id="pn-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="pn-title">
  <div class="dialog wide">
    <h3 id="pn-title">Edit name</h3>
    <div id="pn-body"></div>
    <div class="dialog-actions">
      <button id="pn-cancel" class="link" type="button">Cancel</button>
      <button id="p-name-btn" class="btn primary" type="button">Save</button>
    </div>
  </div>
</div>

<!-- ============ CHANGE PASSWORD DIALOG ============ -->
<div id="pw-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="pw-title">
  <div class="dialog wide">
    <h3 id="pw-title">Change password</h3>
    <div id="pw-body"></div>
    <div class="dialog-actions">
      <button id="pw-cancel" class="link" type="button">Cancel</button>
      <button id="p-pass-btn" class="btn primary" type="button">Change password</button>
    </div>
  </div>
</div>

<!-- ============ RECEIPT DIALOG ============ -->
<div id="receipt-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="receipt-title">
  <div class="dialog wide">
    <h3 id="receipt-title">Payment receipt</h3>
    <div id="receipt-body"></div>
    <div class="dialog-actions">
      <button id="receipt-close" class="link" type="button">Close</button>
      <button id="receipt-print" class="btn primary" type="button">Print</button>
    </div>
  </div>
</div>

<!-- ============ NEW COMPLAINT DIALOG (customer) ============ -->
<div id="cp-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="cp-title">
  <div class="dialog wide">
    <h3 id="cp-title">New complaint</h3>
    <div id="cp-body"></div>
    <div class="dialog-actions">
      <button id="cp-cancel" class="link" type="button">Cancel</button>
      <button id="cp-save" class="btn primary" type="button">Submit</button>
    </div>
  </div>
</div>

<!-- ============ UPDATE COMPLAINT DIALOG (admin) ============ -->
<div id="cu-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="cu-title">
  <div class="dialog wide">
    <h3 id="cu-title">Update complaint</h3>
    <div id="cu-body"></div>
    <div class="dialog-actions">
      <button id="cu-cancel" class="link" type="button">Cancel</button>
      <button id="cu-save" class="btn primary" type="button">Save</button>
    </div>
  </div>
</div>

<!-- ============ NEW CONNECTION DIALOG ============ -->
<div id="conn-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="conn-title">
  <div class="dialog wide">
    <h3 id="conn-title">New connection</h3>
    <div id="conn-body"></div>
    <div class="dialog-actions">
      <button id="conn-cancel" class="link" type="button">Cancel</button>
      <button id="conn-btn" class="btn primary" type="button">Create</button>
    </div>
  </div>
</div>

<div id="toast" class="toast-wrap" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
